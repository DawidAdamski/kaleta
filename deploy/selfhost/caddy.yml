#
# HTTPS with Caddy and an automatic certificate (docs/self-hosting.md,
# "HTTPS, option B"). Needs ports 80 and 443 reachable from the internet and
# a DNS name pointing at this machine.
#
# Needs KALETA_DOMAIN in .env, and the file in COMPOSE_FILE.

services:
  caddy:
    image: docker.io/library/caddy:2.11-alpine
    command: ["caddy", "reverse-proxy", "--from", "${KALETA_DOMAIN:?set KALETA_DOMAIN}", "--to", "kaleta:8080"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - kaleta-caddy:/data
    depends_on:
      kaleta:
        condition: service_healthy
    restart: unless-stopped

  kaleta:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      KALETA_SESSION_COOKIE_SECURE: "true"

volumes:
  kaleta-caddy:
