apiVersion: v2
name: kaleta
description: >-
  Kaleta — a personal budget & finance app — on a self-hosted k3s cluster:
  the app, a bundled PostgreSQL, TLS via Traefik + cert-manager, and backups.
  The self-hosted default (ADR-38): one Postgres, a schema per family, local
  logins, encryption always on.
type: application
