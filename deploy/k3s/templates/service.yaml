apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaleta.fullname" . }}
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kaleta.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
