{{- include "kaleta.validateScaling" . -}}
{{- $multi := gt (int .Values.replicaCount) 1 -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaleta.fullname" . }}
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $multi }}
    # Multi-replica: surge a new pod in before draining an old one so sticky
    # members land on a replacement. Concurrent migrations are safe — the
    # startup migration is serialised by a Postgres advisory lock (ADR-35
    # addendum), so no pre-upgrade Job is needed.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
    {{- else }}
    # One replica + in-process KeyRing + file-backed sessions ⇒ Recreate, so two
    # versions never run (and never migrate the database) at once.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "kaleta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "kaleta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- if $multi }}
      # Let in-flight websockets drain before the pod goes (graceful rollout).
      terminationGracePeriodSeconds: {{ .Values.rollout.terminationGracePeriodSeconds }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kaleta
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KALETA_MODE
              value: {{ .Values.app.mode | quote }}
            - name: KALETA_AUTH_BACKEND
              value: {{ .Values.app.authBackend | quote }}
            - name: KALETA_HOST
              value: "0.0.0.0"
            - name: KALETA_PORT
              value: "8080"
            {{- with (include "kaleta.publicUrl" .) }}
            - name: KALETA_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: KALETA_SESSION_COOKIE_SECURE
              value: {{ .Values.ingress.cookieSecure | quote }}
            {{- if .Values.redis.enabled }}
            # Bundled Valkey: no password in the URL, so an inline value is fine.
            - name: KALETA_REDIS_URL
              value: {{ include "kaleta.redisUrl" . | quote }}
            {{- else if .Values.redis.url }}
            # External Valkey: the URL may carry a password, so it rides in the
            # Secret (KALETA_DB_URL does the same).
            - name: KALETA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kaleta.secretName" . }}
                  key: KALETA_REDIS_URL
            {{- end }}
            # KALETA_SECRET_KEY + KALETA_DB_URL come from the Secret; kept as
            # explicit refs (not envFrom) so the Postgres bootstrap creds in the
            # same Secret never leak into the app's environment.
            - name: KALETA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kaleta.secretName" . }}
                  key: KALETA_SECRET_KEY
            - name: KALETA_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kaleta.secretName" . }}
                  key: KALETA_DB_URL
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /api/v1/health returns 503 until the database is reachable and
          # migrations are applied — a good readiness gate.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Image runs as root (no USER in the Containerfile); HOME=/root, so
            # NiceGUI's file-backed sessions live under /root/.kaleta.
            - name: sessions
              mountPath: /root/.kaleta
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sessions
          {{- if and .Values.app.persistence.enabled (not $multi) }}
          persistentVolumeClaim:
            claimName: {{ include "kaleta.fullname" . }}-sessions
          {{- else }}
          # Multi-replica: NiceGUI session storage lives in Valkey, so each pod's
          # local ~/.kaleta is ephemeral (and a shared RWO PVC could not span
          # pods on different nodes anyway).
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- if and .Values.app.persistence.enabled (not $multi) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kaleta.fullname" . }}-sessions
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.app.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.app.persistence.size }}
{{- end }}
