{{- if and .Values.backup.enabled .Values.postgres.enabled -}}
{{- $pg := .Values.postgres -}}
{{- if .Values.backup.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kaleta.fullname" . }}-backup
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kaleta.fullname" . }}-backup
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "kaleta.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          # pg_dump runs as the app role, no superuser. The dump holds the
          # encrypted ciphertext of user text (ADR-35): a restore needs the same
          # KALETA_SECRET_KEY, so back up the Secret too.
          containers:
            - name: backup
              image: {{ $pg.image | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  OUT="/backup/{{ $pg.database }}-$(date +%Y%m%d-%H%M).dump"
                  pg_dump -Fc -f "$OUT.tmp"
                  mv "$OUT.tmp" "$OUT"
                  find /backup -name '{{ $pg.database }}-*.dump' -mtime +{{ .Values.backup.retentionDays }} -delete
                  ls -lh /backup | tail -3
              env:
                - name: PGHOST
                  value: {{ include "kaleta.postgres.fullname" . | quote }}
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: {{ $pg.appUser | quote }}
                - name: PGDATABASE
                  value: {{ $pg.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kaleta.secretName" . }}
                      key: POSTGRES_APP_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              {{- if .Values.backup.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "kaleta.fullname" . }}-backup
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end -}}
