{{- /* SPDX-License-Identifier: AGPL-3.0-or-later */ -}}
{{- if not .Values.secrets.existingSecret -}}
{{- $pg := .Values.postgres -}}
{{- if .Values.postgres.enabled -}}
{{- $dbUrl := printf "postgresql+asyncpg://%s:%s@%s:5432/%s" $pg.appUser $pg.appPassword (include "kaleta.postgres.fullname" .) $pg.database -}}
{{- $_ := set . "computedDbUrl" $dbUrl -}}
{{- else -}}
{{- if not .Values.externalDatabase.url -}}
{{- fail "postgres.enabled is false but externalDatabase.url is empty — set one." -}}
{{- end -}}
{{- $_ := set . "computedDbUrl" .Values.externalDatabase.url -}}
{{- end -}}
{{- if not .Values.secrets.secretKey -}}
{{- fail "secrets.secretKey is empty — set it (the app refuses the insecure default in production)." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaleta.secretName" . }}
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
type: Opaque
stringData:
  KALETA_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  KALETA_DB_URL: {{ .computedDbUrl | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.postgresPassword | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.postgres.appPassword | quote }}
  {{- end }}
{{- end -}}
