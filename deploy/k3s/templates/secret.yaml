{{- /* SPDX-License-Identifier: AGPL-3.0-or-later */ -}}
{{- if not .Values.secrets.existingSecret -}}
{{- if not .Values.secrets.secretKey -}}
{{- fail "secrets.secretKey is empty — set it (the app refuses the insecure default in production)." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaleta.secretName" . }}
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
type: Opaque
stringData:
  KALETA_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  KALETA_DB_URL: {{ include "kaleta.dbUrl" . | quote }}
  {{- if .Values.postgres.enabled }}
  # Bootstrap creds for the bundled Postgres (consumed by its StatefulSet and
  # init script, not by the app). POSTGRES_APP_PASSWORD matches the app role in
  # KALETA_DB_URL above.
  POSTGRES_PASSWORD: {{ .Values.postgres.postgresPassword | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.postgres.appPassword | quote }}
  {{- end }}
{{- end -}}
