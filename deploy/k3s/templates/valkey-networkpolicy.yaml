{{- if and .Values.redis.enabled .Values.redis.networkPolicy.enabled -}}
# The bundled Valkey has no auth, and its stored NiceGUI sessions are
# bearer-style state — any pod that could reach it could read or forge a
# session (no keys are ever stored there; see the ADR-35 addendum). Limit
# ingress to this release's app pods. k3s enforces NetworkPolicy; for a stronger
# control use an external, password-protected Valkey (redis.url).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kaleta.valkey.fullname" . }}
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kaleta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kaleta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 6379
{{- end -}}
