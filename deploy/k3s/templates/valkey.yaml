{{- if .Values.redis.enabled -}}
{{- $v := .Values.redis -}}
# Bundled single-instance Valkey: the shared store for NiceGUI sessions and the
# login rate-limit counters when running more than one app replica. It never
# holds key material — the account DEK stays in the app pod's memory (ADR-35
# addendum). No auth: it is reachable only in-cluster on its headless Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaleta.valkey.fullname" . }}
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "kaleta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kaleta.valkey.fullname" . }}
  labels:
    {{- include "kaleta.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kaleta.valkey.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kaleta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "kaleta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      securityContext:
        # Run as the valkey image's built-in non-root user so the entrypoint
        # never needs CHOWN/SETUID/SETGID — we drop ALL capabilities below.
        # fsGroup makes the /data PVC writable by that user.
        runAsNonRoot: true
        runAsUser: {{ $v.runAsUser }}
        fsGroup: {{ $v.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ $v.image | quote }}
          # Light RDB snapshots; no AOF — session/rate-limit state is a cache
          # that survives a restart but is not the source of truth.
          args: ["--save", "300", "1", "--appendonly", "no"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not $v.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if $v.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $v.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $v.persistence.size }}
  {{- end }}
{{- end -}}
