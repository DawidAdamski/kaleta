#
# The hosted layout (ADR-35) on a laptop: PostgreSQL 18 + Kaleta with local
# logins (ADR-38) — no mail is sent — and the app connecting as a
# non-superuser role, as on Supabase. Not a deployment: KALETA_DEBUG=true.
#
#   podman compose -f compose.hosted-dev.yml up -d --build
#   ./scripts/hosted_smoke.sh http://localhost:8090
#   podman compose -f compose.hosted-dev.yml down -v
#
# `./scripts/hosted_smoke.sh` with no URL does all three. The self-hosted
# stack is `docker-compose.yml`.

name: kaleta-hosted-dev

services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaleta
    volumes:
      - hosted-dev-pg:/var/lib/postgresql
      # Creates `kaleta_app`, the non-superuser role the app connects as.
      - ./deploy/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaleta"]
      interval: 2s
      timeout: 3s
      retries: 30

  kaleta:
    build:
      context: .
      dockerfile: Containerfile.full
    image: kaleta:full
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KALETA_HOSTED_DEV_PORT:-8090}:8080"
    environment:
      KALETA_AUTH_BACKEND: local
      KALETA_DEBUG: "true"
      KALETA_DB_URL: postgresql://kaleta_app:kaleta_app@db:5432/kaleta
      KALETA_SECRET_KEY: hosted-dev-only-not-a-secret
      KALETA_PUBLIC_URL: http://localhost:${KALETA_HOSTED_DEV_PORT:-8090}
      KALETA_HOST: 0.0.0.0
      KALETA_PORT: "8080"
    volumes:
      # NiceGUI's session files: a restarted container keeps its sessions
      # (and asks every member to unlock again). Under the non-root user's
      # home (uid 10001) — see Containerfile.
      - hosted-dev-state:/home/app/.kaleta
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  hosted-dev-pg:
  hosted-dev-state:
