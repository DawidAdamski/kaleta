[project]
name = "kaleta"
# Derived from git by hatch-vcs (see [tool.hatch.version]); a build between tags
# is X.Y.devN+g<shortsha>, unique per commit. Never hard-code it here.
dynamic = ["version"]
description = "Kaleta - Personal Budget & Finance Management Application"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Dawid" },
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "nicegui>=3.14.0",
    "sqlalchemy>=2.1",
    "alembic>=1.13",
    "pydantic>=2.13",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.42.0",
    # PostgreSQL 16+ is the only database (ADR-38): asyncpg for the app,
    # psycopg2 for Alembic's synchronous migrations.
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "greenlet>=3.5",
    "fastapi>=0.139.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.10.0",
    "qrcode>=8.2",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
forecast = [
    "prophet>=1.1",
]
# XLSX bank statements (Wise). An extra rather than a base dependency: one
# bank offers XLSX today, and every one of them also offers CSV.
import-xlsx = [
    "openpyxl>=3.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# Optional Sentry-protocol forwarding of anonymous error events
# (KALETA_ERROR_TRACKER_DSN, e.g. a self-hosted GlitchTip). Off by default.
tracker = [
    "sentry-sdk>=2.20",
]
# The hosted layout (ADR-35): Redis for shared session state and httpx for
# Supabase Auth — NiceGUI already brings httpx in; naming it here keeps the
# hosted install honest about what it calls.
hosted = [
    "redis>=5.0",
    "httpx>=0.27",
]

[project.scripts]
kaleta = "kaleta.main:main"
kaleta-admin = "kaleta.cli.tenant_admin:entry_point"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from git tags (vX.Y.Z). With no tag yet, setuptools_scm (under
# hatch-vcs) yields 0.0.1.devN+g<shortsha> — unique per commit, so every build is
# traceable. fallback-version keeps a source tarball without .git buildable.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Tags are prefixed with "v" (v0.3.0); match only those.
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'

# Write the computed version into a module so a built wheel or Docker image
# reports it even without .git present. Generated; git-ignored.
[tool.hatch.build.hooks.vcs]
version-file = "src/kaleta/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaleta"]

[tool.ruff]
target-version = "py313"
line-length = 100
# ruff 0.16 started formatting code blocks inside Markdown by default. Our
# Markdown is prose and records (ADRs, archived plans are frozen), so keep
# ruff to Python as it was before the upgrade.
# Also src/kaleta/_version.py — generated by hatch-vcs at build, git-ignored.
extend-exclude = ["*.md", "src/kaleta/_version.py"]

[tool.ruff.lint]
# S is ruff's port of bandit's checks; it replaces the separate bandit run
# (see docs/plans/lint-hardening.md). RUF carries the ruff-specific rules,
# including RUF100 (unused `# noqa`) which keeps suppressions honest.
select = [
    "E", "F", "I", "N", "W", "UP", "B", "SIM", "S", "RUF",
    # Part 2 (lint-hardening-part-2): async footguns, logging correctness,
    # banned-api (money ≠ Float), implicit str-concat, f-strings, raise-from,
    # pylint errors, comprehensions, pie, return consistency, private access,
    # perf anti-patterns.
    "ASYNC", "G", "LOG", "TID", "ISC", "FLY", "RSE", "PLE",
    "C4", "PIE", "RET", "SLF", "PERF",
]
ignore = [
    # Prose in two languages uses typographic dashes and quotes on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Money and amounts are stored as Numeric/Decimal (ADR precision 15, scale 2),
# never as binary floats — a Float column silently loses cents. The only
# legitimate float column is a 0..1 similarity score (payee_merge), which keeps
# a documented `# noqa: TID251`.
"sqlalchemy.Float".msg = "Amounts must be Numeric/Decimal, not Float (floats lose cents). A genuine non-money float (e.g. a 0..1 score) needs an explicit noqa."
"sqlalchemy.REAL".msg = "Amounts must be Numeric/Decimal, not REAL."
"sqlalchemy.Double".msg = "Amounts must be Numeric/Decimal, not Double."

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends/Query in argument defaults — B008 is a false positive there.
"src/kaleta/api/**" = ["B008"]
# main.py pins NICEGUI_STORAGE_PATH with stdlib before importing nicegui.
"src/kaleta/main.py" = ["E402"]
# Demo data is not a security boundary: `random` is the right generator here.
"src/kaleta/seeders/**" = ["S311"]
# Tests assert, use fixture passwords, spawn the app under test and bind
# 0.0.0.0 for the e2e server — none of which is production code. Tests also
# legitimately reach into private members of the unit under test (SLF001).
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607", "S608", "SLF001"]
# Operator scripts: demo password, subprocess calls, benchmark randomness.
"scripts/**" = ["S105", "S310", "S311", "S603", "S607"]
# Data migrations build statements from literal table names, and record the
# historical schema verbatim — including the one legitimate Float column
# (a 0..1 similarity score), so the money-guard (TID251) does not apply here.
"alembic/versions/**" = ["S608", "TID251"]

[tool.mypy]
python_version = "3.13"
strict = true
# Beyond strict (lint-hardening-part-2): require a code on every
# `# type: ignore` (pairs with RUF100 to keep suppressions honest) and flag
# variables that may be unbound on some path. Both are clean on the tree today.
#
# Deliberately NOT enabled here (deferred to their own chore): `warn_unreachable`,
# `truthy-bool` and `redundant-expr`. On this codebase they almost only surface
# the "declared non-optional but runtime-optional" gap — SQLAlchemy relationships
# (`if p.account`) and NiceGUI context (`if ui.context.client`) that the type
# system models as always-present but code defensively guards. Adopting them now
# would mean ~10 `# type: ignore` on legitimate defensive code; the real fix is
# to type those relationships/results as optional, which is its own change.
enable_error_code = [
    "possibly-undefined",
    "ignore-without-code",
]
# Pydantic 2 models and settings: validate field types in constructors and
# `model_validate` calls the way the runtime does.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Without init_typed the plugin types every model __init__ argument as Any,
# which is *looser* than plain strict mypy; with it, constructor arguments
# are checked against the declared field types.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: CLIs in subprocesses, migrations of a file database, timing budgets — run by verify.sh and on main/nightly CI, not per pull request (test-suite-speed)",
]

[tool.importlinter]
root_package = "kaleta"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layered architecture (views → services → models)"
type = "layers"
layers = [
    "kaleta.views",
    "kaleta.api",
    "kaleta.auth",
    "kaleta.pwa",
    "kaleta.services",
    "kaleta.seeders",
    "kaleta.schemas",
    "kaleta.i18n",
    "kaleta.models",
    "kaleta.db",
    "kaleta.crypto",
    "kaleta.observability",
    "kaleta.config",
    "kaleta.core",
]
ignore_imports = [
    # db.audit registers AuditLog in Base.metadata at import time.
    "kaleta.db.audit -> kaleta.models.audit_log",
]

[[tool.importlinter.contracts]]
id = "views-no-data-access"
name = "Views must not import models, db, or sqlalchemy directly"
type = "forbidden"
source_modules = ["kaleta.views"]
forbidden_modules = ["kaleta.models", "kaleta.db", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "services-no-ui"
name = "Services must not import views or nicegui"
type = "forbidden"
source_modules = ["kaleta.services"]
forbidden_modules = ["kaleta.views", "nicegui"]

[[tool.importlinter.contracts]]
id = "api-no-views"
name = "API must not import views"
type = "forbidden"
source_modules = ["kaleta.api"]
forbidden_modules = ["kaleta.views"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.5",
    "ruff>=0.15.8",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "faker>=40.11.1",
    "coverage>=7.13.5",
    "import-linter>=2.13",
    "openpyxl>=3.1",
    "types-openpyxl>=3.1",
    "types-qrcode>=8.2.0.20260518",
    "redis>=5.0",
    "fakeredis>=2.26",
    "pytest-xdist>=3.8.0",
    "pip-audit>=2.10.1",
]
