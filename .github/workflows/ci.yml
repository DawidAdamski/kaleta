name: CI

# PostgreSQL is the only database (ADR-38): the `postgres` job is the suite.
# Tiers (docs/plans/archive/test-suite-speed.md): a pull request runs the fast tier
# in parallel; push to main and the nightly run add the slow tier (serial — it
# holds a timing budget) and the Valkey job. The laptop runs everything
# through ./scripts/verify.sh.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Import linter
        run: uv run lint-imports

      - name: Doc link checker
        run: uv run python scripts/check_doc_links.py

      - name: SPDX headers
        run: uv run python scripts/check_spdx_headers.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaleta
          POSTGRES_PASSWORD: kaleta
          POSTGRES_DB: kaleta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaleta -d kaleta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KALETA_DB_URL: postgresql+asyncpg://kaleta:kaleta@localhost:5432/kaleta
      KALETA_DEBUG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # `hosted` brings the multi-tenant suites (registry, provisioning,
      # tenant isolation) into this job; the suite migrates its databases
      # itself — under -n one per worker (tests/suite_database.py).
      - name: Install dependencies
        run: uv sync --group dev --extra postgres --extra hosted

      - name: Unit + integration tests (fast tier)
        run: uv run pytest tests/unit tests/integration -n auto -q -m "not slow"

      - name: Unit + integration tests (slow tier)
        if: github.event_name != 'pull_request'
        run: uv run pytest tests/unit tests/integration -q -m slow

      - name: Spec coverage
        run: uv run python scripts/spec_coverage.py

  # KALETA_REDIS_URL moves both NiceGUI session storage and the login rate
  # limiter into a Redis-protocol server — the hosted multi-replica
  # configuration. Valkey is the server we recommend and test against.
  valkey:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaleta
          POSTGRES_PASSWORD: kaleta
          POSTGRES_DB: kaleta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaleta -d kaleta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KALETA_REDIS_URL: redis://localhost:6379/0
      KALETA_DB_URL: postgresql+asyncpg://kaleta:kaleta@localhost:5432/kaleta
      KALETA_DEBUG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --extra postgres --extra hosted

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Auth unit tests
        run: uv run pytest tests/unit/auth/ -q

      - name: Rate limiter across replicas
        run: uv run pytest tests/integration/test_login_rate_limit_replicas.py -q

      - name: Auth e2e against Valkey
        run: uv run pytest tests/e2e/test_auth.py -q
