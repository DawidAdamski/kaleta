name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  # release-please dispatches this against the new vX.Y.Z tag (a tag pushed with
  # GITHUB_TOKEN cannot trigger the `tags: v*` path above).
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME }}/kaleta

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DOCKER_HUB
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # hatch-vcs needs the tags to derive the version (auto-versioning).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Compute version
        id: ver
        # The same value the package would report; baked into the image below,
        # since the build itself runs without .git. stderr carries uv/hatch chatter.
        # Fail loudly rather than let the image silently fall back to 0.0.0.
        run: |
          v="$(uvx --with hatch-vcs hatch version 2>/dev/null)"
          test -n "$v" && echo "$v" | grep -qE '^[0-9]'
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Dependabot-triggered runs get no Actions secrets, so
          # DOCKER_USERNAME is empty and the Docker Hub name collapses to
          # "/kaleta" — an invalid tag that fails the build. Tag it only
          # when the secret is there; PR builds never push anyway.
          images: |
            name=${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            KALETA_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
