name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search [existing issues](https://github.com/DawidAdamski/kaleta/issues) first.
        For security vulnerabilities, use [Security Advisories](https://github.com/DawidAdamski/kaleta/security/advisories/new) instead.

        Reporting from inside the app (account menu → **Report a problem**)
        gives you a report ID and fills the fields below in for you.

  - type: input
    id: report_id
    attributes:
      label: Report ID
      description: From the in-app report dialog, if you used it.
      placeholder: e.g. 7KQ2M4XB
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behaviour.
      placeholder: |
        1. Start Kaleta with ...
        2. Navigate to ...
        3. Click ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kaleta version or commit
      description: Git commit SHA, tag, or "main" if running from source.
      placeholder: main @ abc1234
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: Page
      description: The page you were on when it failed.
      placeholder: /transactions
    validations:
      required: false

  - type: input
    id: events
    attributes:
      label: Event IDs
      description: Error IDs the app showed when it failed.
      placeholder: e.g. 4BXDD9XG
    validations:
      required: false

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - web (browser)
        - app (desktop window)
        - api (headless)
        - Docker / Podman
        - other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, database (SQLite / PostgreSQL), browser if relevant.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant log output or screenshots (redact personal financial data).
    validations:
      required: false
