  #   build: .
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - KALETA_DB_URL=postgresql://kaleta:kaleta@db:5432/kaleta
  #     - KALETA_HOST=0.0.0.0
  #     - KALETA_PORT=8080
  #   depends_on:
  #     - db
  #   restart: unless-stopped
  #
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     - POSTGRES_USER=kaleta
  #     - POSTGRES_PASSWORD=kaleta
  #     - POSTGRES_DB=kaleta
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped

  # Uncomment for the hosted layout (ADR-35) against an external PostgreSQL —
  # the Supabase CLI local stack (`supabase start`) or plain postgres:16 with
  # a Supabase Auth you can reach. Every account gets a schema of its own.
  # kaleta-hosted:
